[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialmemory-x"
version = "0.1.0"
description = "Evidence-first RGB video spatial change analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless==4.11.0.86", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn==0.34.0", "python-multipart==0.0.20"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
neural = ["torch==2.6.0", "torchvision==0.21.0", "einops==0.8.1", "transformers==4.49.0", "pillow==11.1.0", "safetensors==0.5.3", "hydra-core==1.3.2", "iopath==0.1.10"]

[project.scripts]
spatialmemory = "spatialmemory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
spatialmemory = ["dashboard.html"]
